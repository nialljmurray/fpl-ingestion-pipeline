main:
  steps:
    - run_ingestion:
        call: http.post
        args:
          url: https://YOUR_INGESTION_CLOUD_RUN_URL
          auth:
            type: OIDC
          timeout: 600
        result: ingestion_result

    - check_ingestion:
        switch:
          - condition: ${ingestion_result.code != 200}
            raise: "Ingestion job failed — aborting dbt run"

    - run_dbt:
        call: http.post
        args:
          url: https://europe-west1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/YOUR_PROJECT_ID/jobs/dbt-fpl:run
          auth:
            type: OAuth2
          timeout: 600
        result: dbt_result

    - return_result:
        return: "Pipeline completed successfully"